name: Release
on:
  # Can be run manually
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # on git push
  push:
    branches:
      - main

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Answers "did this commit arrive through a pull request, and from which branch?" - which a job's
  # own `if:` cannot ask: a job condition is evaluated before any job runs, and a push payload says
  # nothing about a pull request.
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: source
    # An empty `head-ref` means the commit came from no pull request and runs the tests - the safe
    # direction, since nothing recorded that this exact commit was tested anywhere.
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  release:
    needs: [source, test]
    # `always()` because `needs` alone would block this whenever `test` is *skipped*, the normal
    # path for a `no-test` commit or a pull request merged from dev. `needs.source.result` is the
    # second lock: `test` is skipped whenever `source` fails, so without it a failed lookup would
    # release untested code.
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # `rman version --push`, the GitHub Release and the merge back into dev all write;
    # `id-token: write` is npm Trusted Publishing (OIDC).
    permissions:
      id-token: write
      contents: write
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
